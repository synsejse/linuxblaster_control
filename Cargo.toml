[workspace]
members = ["crates/app"]
default-members = ["crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/synsejse/linuxblaster_control"

[workspace.dependencies]
soundblaster-x4 = { git = "https://github.com/synsejse/soundblaster-x4-rs", rev = "f9a61d8f55fb16398c218ded621fd0d4127759e3", version = "=0.1.0" }
iced_t3 = { git = "https://github.com/synsejse/iced_t3", rev = "c9be75b7f1c3b1f32ee9328aa90ceb2c8dc6fee5", version = "=0.1.0" }
serde_json = "1.0.148"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
# Fallible APIs are pervasive; their invariants are documented in prose.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
