[package]
name = "linuxblaster_control"
version = "0.1.0"
edition = "2024"
description = "Control the Creative Sound Blaster X4 on Linux: output, Direct Mode, headphone gain and hardware EQ"
license = "MIT"
repository = "https://github.com/synsejse/linuxblaster_control"
homepage = "https://github.com/synsejse/linuxblaster_control"

[dependencies]
aes-gcm = "0.10"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
getrandom = "0.2"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
serialport = "4.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

# ─── Release packages (see packaging/build-release.sh) ───────────────────────

[package.metadata.deb]
name = "linuxblaster-control"
maintainer = "synsejse <https://github.com/synsejse>"
section = "sound"
priority = "optional"
# libdbus is loaded at runtime by the Load/Save Profile file dialog
depends = "$auto, libdbus-1-3"
extended-description = "Native X4 controller using CDC serial: output, Direct Mode, gain and ten-band hardware EQ. Includes desktop serial access rules."
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/linuxblaster_control", "usr/bin/", "755"],
    ["packaging/linuxblaster-control.desktop", "usr/share/applications/", "644"],
    ["packaging/linuxblaster-control.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/linuxblaster-control.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/70-linuxblaster-control.rules", "usr/lib/udev/rules.d/", "644"],
    ["README.md", "usr/share/doc/linuxblaster-control/", "644"],
]

[package.metadata.generate-rpm]
name = "linuxblaster-control"
summary = "Control the Creative Sound Blaster X4"
url = "https://github.com/synsejse/linuxblaster_control"
post_install_script = "udevadm control --reload-rules >/dev/null 2>&1 || :; udevadm trigger --subsystem-match=tty --action=change >/dev/null 2>&1 || :"
post_uninstall_script = "udevadm control --reload-rules >/dev/null 2>&1 || :"
# The automatic detection emits glibc requirements like
# "libc.so.6(GLIBC_2.18)[WEAK](64bit)" that no distro provides,
# so the dependencies are listed by hand (same libraries the .deb depends on).
auto-req = "no"
assets = [
    { source = "target/release/linuxblaster_control", dest = "/usr/bin/linuxblaster_control", mode = "755" },
    { source = "packaging/linuxblaster-control.desktop", dest = "/usr/share/applications/linuxblaster-control.desktop", mode = "644" },
    { source = "packaging/linuxblaster-control.png", dest = "/usr/share/icons/hicolor/256x256/apps/linuxblaster-control.png", mode = "644" },
    { source = "packaging/linuxblaster-control.svg", dest = "/usr/share/icons/hicolor/scalable/apps/linuxblaster-control.svg", mode = "644" },
    { source = "packaging/70-linuxblaster-control.rules", dest = "/usr/lib/udev/rules.d/70-linuxblaster-control.rules", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/linuxblaster-control/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
"libudev.so.1()(64bit)" = "*"
# loaded at runtime by the Load/Save Profile file dialog
"libdbus-1.so.3()(64bit)" = "*"
"libm.so.6(GLIBC_2.35)(64bit)" = "*"
