[package]
name = "linuxblaster_control"
description = "Control the Creative Sound Blaster X4 on Linux: output, Direct Mode, headphone gain and hardware EQ"
homepage = "https://github.com/synsejse/linuxblaster_control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
iced_t3 = { git = "https://github.com/synsejse/iced_t3", rev = "c9be75b7f1c3b1f32ee9328aa90ceb2c8dc6fee5" }
soundblaster-x4 = { path = "../x4" }
serde_json.workspace = true
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "x11", "wayland", "tokio", "canvas", "image-without-codecs", "advanced"] }
iced_aw = { version = "=0.14.1", default-features = false, features = ["number_input"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
pollster = "0.4"

[lints]
workspace = true
